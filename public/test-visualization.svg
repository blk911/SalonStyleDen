<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Background -->
  <rect style="fill:#f8f9fa;stroke:none" width="800" height="600" x="0" y="0" />
  
  <!-- Title -->
  <text xml:space="preserve" 
    style="font-style:normal;font-weight:bold;font-size:24px;font-family:Arial;text-align:center;text-anchor:middle;fill:#333333"
    x="400" y="50">VMB Network Visualization (Test)</text>
    
  <!-- Description -->
  <text xml:space="preserve" 
    style="font-style:normal;font-weight:normal;font-size:14px;font-family:Arial;text-align:center;text-anchor:middle;fill:#666666"
    x="400" y="80">Component dependencies diagram</text>
  
  <!-- Nodes -->
  <g id="nodes">
    <!-- Core Nodes -->
    <g transform="translate(400,300)">
      <!-- Central Node -->
      <circle cx="0" cy="0" r="50" fill="#ff69b4" opacity="0.9" />
      <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">AppRoot</text>
      
      <!-- Connected Nodes -->
      <g id="node-dashboard" transform="translate(-120,-100)">
        <circle cx="0" cy="0" r="40" fill="#4a90e2" opacity="0.9" />
        <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Dashboard</text>
      </g>
      
      <g id="node-components" transform="translate(140,-90)">
        <circle cx="0" cy="0" r="40" fill="#50c878" opacity="0.9" />
        <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Components</text>
      </g>
      
      <g id="node-layout" transform="translate(-140,100)">
        <circle cx="0" cy="0" r="35" fill="#ffa500" opacity="0.9" />
        <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Layout</text>
      </g>
      
      <g id="node-utils" transform="translate(120,120)">
        <circle cx="0" cy="0" r="30" fill="#9370db" opacity="0.9" />
        <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12">Utils</text>
      </g>
      
      <!-- Connections -->
      <g id="connections" stroke-width="2" opacity="0.6">
        <!-- AppRoot to Dashboard -->
        <path d="M 0,0 L -120,-100" stroke="#4a90e2" />
        
        <!-- AppRoot to Components -->
        <path d="M 0,0 L 140,-90" stroke="#50c878" />
        
        <!-- AppRoot to Layout -->
        <path d="M 0,0 L -140,100" stroke="#ffa500" />
        
        <!-- AppRoot to Utils -->
        <path d="M 0,0 L 120,120" stroke="#9370db" />
        
        <!-- Dashboard to Layout -->
        <path d="M -120,-100 L -140,100" stroke="#ddd" stroke-dasharray="5,5" />
        
        <!-- Components to Utils -->
        <path d="M 140,-90 L 120,120" stroke="#ddd" stroke-dasharray="5,5" />
      </g>
    </g>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(650,550)">
    <rect x="-120" y="-80" width="120" height="80" fill="white" stroke="#ddd" />
    <text x="-110" y="-60" fill="#333" font-family="Arial" font-size="10" font-weight="bold">Legend</text>
    
    <circle cx="-100" cy="-40" r="5" fill="#ff69b4" />
    <text x="-85" y="-37" fill="#333" font-family="Arial" font-size="10">AppRoot</text>
    
    <circle cx="-100" cy="-20" r="5" fill="#4a90e2" />
    <text x="-85" y="-17" fill="#333" font-family="Arial" font-size="10">Page</text>
    
    <circle cx="-100" cy="0" r="5" fill="#50c878" />
    <text x="-85" y="3" fill="#333" font-family="Arial" font-size="10">Component</text>
  </g>
  
  <!-- Footer -->
  <text xml:space="preserve" 
    style="font-style:normal;font-weight:normal;font-size:12px;font-family:Arial;text-align:center;text-anchor:middle;fill:#999999"
    x="400" y="580">Generated by VMB Network Visualization Tool</text>
</svg>
