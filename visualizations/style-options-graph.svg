<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">VMB Style Options Engine Dependency Graph</text>
  <text x="400" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">client/src/components/promos/VmbStyleOptions.tsx</text>
  
  <!-- Graph nodes -->
  <g id="nodes">
    <!-- Core Components -->
    <circle cx="400" cy="150" r="40" fill="#ff1493" opacity="0.9" />
    <text x="400" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="white">VmbStyleOptions</text>
    
    <!-- Feature Components -->
    <circle cx="200" cy="250" r="30" fill="#fb5607" opacity="0.9" />
    <text x="200" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="white">StyleCard</text>
    
    <circle cx="350" cy="250" r="30" fill="#fb5607" opacity="0.9" />
    <text x="350" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="white">StyleSelector</text>
    
    <circle cx="500" cy="250" r="30" fill="#fb5607" opacity="0.9" />
    <text x="500" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="white">StylePreview</text>
    
    <circle cx="650" cy="250" r="30" fill="#fb5607" opacity="0.9" />
    <text x="650" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="white">StyleCarousel</text>
    
    <!-- UI Components -->
    <circle cx="150" cy="350" r="25" fill="#3a86ff" opacity="0.9" />
    <text x="150" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Card</text>
    
    <circle cx="250" cy="350" r="25" fill="#3a86ff" opacity="0.9" />
    <text x="250" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Image</text>
    
    <circle cx="350" cy="350" r="25" fill="#3a86ff" opacity="0.9" />
    <text x="350" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Tabs</text>
    
    <circle cx="450" cy="350" r="25" fill="#3a86ff" opacity="0.9" />
    <text x="450" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Button</text>
    
    <circle cx="550" cy="350" r="25" fill="#3a86ff" opacity="0.9" />
    <text x="550" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="white">AspectRatio</text>
    
    <circle cx="650" cy="350" r="25" fill="#3a86ff" opacity="0.9" />
    <text x="650" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="white">ScrollArea</text>
    
    <!-- Hooks & Utils -->
    <circle cx="250" cy="450" r="20" fill="#8338ec" opacity="0.9" />
    <text x="250" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">useHook</text>
    
    <circle cx="350" cy="450" r="20" fill="#8338ec" opacity="0.9" />
    <text x="350" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">useHook</text>
    
    <circle cx="450" cy="450" r="20" fill="#8338ec" opacity="0.9" />
    <text x="450" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">fetchStyles</text>
    
    <circle cx="550" cy="450" r="20" fill="#8338ec" opacity="0.9" />
    <text x="550" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">styleUtils</text>
  </g>
  
  <!-- Graph edges -->
  <g id="edges" stroke="#333" stroke-width="1.5" opacity="0.6">
    <!-- Main Component to Feature Components -->
    <line x1="400" y1="150" x2="200" y2="250" />
    <line x1="400" y1="150" x2="350" y2="250" />
    <line x1="400" y1="150" x2="500" y2="250" />
    <line x1="400" y1="150" x2="650" y2="250" />
    
    <!-- Feature Components to UI Components -->
    <line x1="200" y1="250" x2="150" y2="350" />
    <line x1="200" y1="250" x2="250" y2="350" />
    <line x1="350" y1="250" x2="350" y2="350" />
    <line x1="350" y1="250" x2="450" y2="350" />
    <line x1="500" y1="250" x2="550" y2="350" />
    <line x1="650" y1="250" x2="650" y2="350" />
    
    <!-- Feature Components to Hooks & Utils -->
    <line x1="200" y1="250" x2="250" y2="450" />
    <line x1="350" y1="250" x2="350" y2="450" />
    <line x1="500" y1="250" x2="450" y2="450" />
    <line x1="650" y1="250" x2="550" y2="450" />
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 530)">
    <rect width="700" height="60" fill="#fff" stroke="#ddd" />
    
    <circle cx="50" cy="30" r="15" fill="#ff1493" opacity="0.9" />
    <text x="80" y="35" font-family="Arial" font-size="12">Main Component</text>
    
    <circle cx="250" cy="30" r="15" fill="#fb5607" opacity="0.9" />
    <text x="280" y="35" font-family="Arial" font-size="12">Feature Components</text>
    
    <circle cx="450" cy="30" r="15" fill="#3a86ff" opacity="0.9" />
    <text x="480" y="35" font-family="Arial" font-size="12">UI Components</text>
    
    <circle cx="650" cy="30" r="15" fill="#8338ec" opacity="0.9" />
    <text x="680" y="35" font-family="Arial" font-size="12">Hooks & Utils</text>
  </g>
</svg>