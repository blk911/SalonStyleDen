<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">VMB Component Network Graph</text>
  
  <!-- Graph nodes -->
  <g id="nodes">
    <!-- Core Components -->
    <circle cx="400" cy="150" r="40" fill="#ff1493" opacity="0.9" />
    <text x="400" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="white">App.tsx</text>
    
    <!-- Layout Components -->
    <circle cx="250" cy="250" r="35" fill="#fb5607" opacity="0.9" />
    <text x="250" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Layout</text>
    
    <circle cx="550" cy="250" r="35" fill="#fb5607" opacity="0.9" />
    <text x="550" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Pages</text>
    
    <!-- UI Components -->
    <circle cx="180" cy="350" r="30" fill="#3a86ff" opacity="0.9" />
    <text x="180" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Header</text>
    
    <circle cx="320" cy="350" r="30" fill="#3a86ff" opacity="0.9" />
    <text x="320" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Footer</text>
    
    <circle cx="460" cy="350" r="30" fill="#3a86ff" opacity="0.9" />
    <text x="460" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Dashboard</text>
    
    <circle cx="600" cy="350" r="30" fill="#3a86ff" opacity="0.9" />
    <text x="600" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="white">ClientPage</text>
    
    <!-- Feature Components -->
    <circle cx="150" cy="450" r="25" fill="#8338ec" opacity="0.9" />
    <text x="150" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Logo</text>
    
    <circle cx="250" cy="450" r="25" fill="#8338ec" opacity="0.9" />
    <text x="250" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Nav</text>
    
    <circle cx="350" cy="450" r="25" fill="#8338ec" opacity="0.9" />
    <text x="350" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">BrandName</text>
    
    <circle cx="450" cy="450" r="25" fill="#8338ec" opacity="0.9" />
    <text x="450" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Carousel</text>
    
    <circle cx="550" cy="450" r="25" fill="#8338ec" opacity="0.9" />
    <text x="550" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">StyleOptions</text>
    
    <circle cx="650" cy="450" r="25" fill="#8338ec" opacity="0.9" />
    <text x="650" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Invitations</text>
  </g>
  
  <!-- Graph edges -->
  <g id="edges" stroke="#333" stroke-width="1.5" opacity="0.6">
    <!-- App to Layout & Pages -->
    <line x1="400" y1="150" x2="250" y2="250" />
    <line x1="400" y1="150" x2="550" y2="250" />
    
    <!-- Layout to Header & Footer -->
    <line x1="250" y1="250" x2="180" y2="350" />
    <line x1="250" y1="250" x2="320" y2="350" />
    
    <!-- Pages to Dashboard & ClientPage -->
    <line x1="550" y1="250" x2="460" y2="350" />
    <line x1="550" y1="250" x2="600" y2="350" />
    
    <!-- Header to Logo & Nav -->
    <line x1="180" y1="350" x2="150" y2="450" />
    <line x1="180" y1="350" x2="250" y2="450" />
    
    <!-- Footer to BrandName -->
    <line x1="320" y1="350" x2="350" y2="450" />
    
    <!-- Dashboard to Carousel & StyleOptions -->
    <line x1="460" y1="350" x2="450" y2="450" />
    <line x1="460" y1="350" x2="550" y2="450" />
    
    <!-- ClientPage to Invitations -->
    <line x1="600" y1="350" x2="650" y2="450" />
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 530)">
    <rect width="700" height="60" fill="#fff" stroke="#ddd" />
    
    <circle cx="50" cy="30" r="15" fill="#ff1493" opacity="0.9" />
    <text x="80" y="35" font-family="Arial" font-size="12">Core Components</text>
    
    <circle cx="250" cy="30" r="15" fill="#fb5607" opacity="0.9" />
    <text x="280" y="35" font-family="Arial" font-size="12">Layout Components</text>
    
    <circle cx="450" cy="30" r="15" fill="#3a86ff" opacity="0.9" />
    <text x="480" y="35" font-family="Arial" font-size="12">UI Components</text>
    
    <circle cx="650" cy="30" r="15" fill="#8338ec" opacity="0.9" />
    <text x="680" y="35" font-family="Arial" font-size="12">Feature Components</text>
  </g>
</svg>